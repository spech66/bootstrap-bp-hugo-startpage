# theme.toml template for a Hugo theme
# See https://github.com/gohugoio/hugoThemes#themetoml for an example

name = "Bootstrap-BP-Startpage"
license = "MIT"
licenselink = "https://github.com/spech66/bootstrap-bp-hugo-startpage/blob/master/LICENSE"
description = "Lightweight Hugo startpage theme with grouped links, icon tiles and search, which provides out of the box best practices."
homepage = "https://github.com/spech66/bootstrap-bp-hugo-startpage/"
demosite = "https://www.sebastianpech.com/"
tags = ["minimalist", "single-page", "clean", "simple", "responsive", "one-page", "light", "fast"]
features = ["responsive", "svg icons", "webp background", "open graph", "twitter cards"]
min_version = "0.158.0"

[author]
  name = "Sebastian Pech"
  homepage = "https://www.spech.de/"
